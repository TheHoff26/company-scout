name: Maintain job sources

on:
  push:
    branches: [main]
    paths: ["docs/companies.json"]   # after you add or edit a company
  schedule:
    - cron: "17 3 * * *"             # daily: continue pending detections; Mondays: re-check all sources
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Detect and check job sources
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "1" -a "${{ github.event_name }}" = "schedule" ]; then
            python -m scout.run --check
          else
            python -m scout.run
          fi

      - name: Save results
        run: |
          git config user.name "company-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/companies.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Job sources updated $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
